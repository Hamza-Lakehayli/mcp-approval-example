<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1010" viewBox="0 0 1320 1010" role="img" aria-labelledby="title desc">
<title id="title">Inventory Console human approval workflow</title><desc id="desc">A sequence overview of protected SQL requests through the UI, Agno AgentOS, the tool hook, Jira approval, and PostgreSQL, with approved and rejected outcomes.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker><marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#15803d"/></marker><marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b91c1c"/></marker><style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.title{font-size:23px;font-weight:700}.sub{font-size:13px;fill:#475569}.head{font-size:12px;font-weight:650}.msg{font-size:11.5px;fill:#334155}.note{font-size:11px;fill:#475569}.lane{stroke:#cbd5e1;stroke-width:1;stroke-dasharray:4 5}.line{stroke:#64748b;stroke-width:1.5;fill:none;marker-end:url(#a)}.green{stroke:#15803d;stroke-width:1.6;fill:none;marker-end:url(#g)}.red{stroke:#b91c1c;stroke-width:1.6;fill:none;marker-end:url(#r)}</style></defs>
<rect width="1320" height="1010" fill="#fff"/><text x="32" y="36" class="title">Human approval for protected SQL</text><text x="32" y="59" class="sub">A reviewer changes the Jira issue; the UI then resumes the paused run or cancels it.</text>
<g><rect x="22" y="78" width="126" height="46" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/><text x="85" y="106" text-anchor="middle" class="head">User / reviewer</text><rect x="182" y="78" width="126" height="46" rx="8" fill="#eff6ff" stroke="#bfdbfe"/><text x="245" y="106" text-anchor="middle" class="head">React UI</text><rect x="342" y="78" width="126" height="46" rx="8" fill="#eff6ff" stroke="#bfdbfe"/><text x="405" y="98" text-anchor="middle" class="head">Agno AgentOS</text><text x="405" y="114" text-anchor="middle" class="head">+ approval API</text><rect x="502" y="78" width="126" height="46" rx="8" fill="#fff7ed" stroke="#fed7aa"/><text x="565" y="98" text-anchor="middle" class="head">Tool hook +</text><text x="565" y="114" text-anchor="middle" class="head">Postgres MCP</text><rect x="662" y="78" width="126" height="46" rx="8" fill="#fff7ed" stroke="#fed7aa"/><text x="725" y="98" text-anchor="middle" class="head">run_admin_sql</text><text x="725" y="114" text-anchor="middle" class="head">confirmation gate</text><rect x="822" y="78" width="126" height="46" rx="8" fill="#f5f3ff" stroke="#ddd6fe"/><text x="885" y="98" text-anchor="middle" class="head">Jira HITL</text><text x="885" y="114" text-anchor="middle" class="head">middleware</text><rect x="982" y="78" width="126" height="46" rx="8" fill="#f5f3ff" stroke="#ddd6fe"/><text x="1045" y="106" text-anchor="middle" class="head">Jira</text><rect x="1142" y="78" width="126" height="46" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/><text x="1205" y="106" text-anchor="middle" class="head">PostgreSQL</text></g>
<g class="lane"><path d="M85 124V650M245 124V650M405 124V650M565 124V650M725 124V650M885 124V650M1045 124V650M1205 124V650"/></g>
<g class="line"><path d="M85 153H245M245 192H405M405 231H565M565 270H405M405 309H725M725 348H405M405 387H885M885 426H1045M885 465H1205M885 504H245M85 543H1045M245 582H405M405 621H1045"/></g>
<g class="msg" text-anchor="middle"><text x="165" y="147">Ask for DROP / ALTER</text><text x="325" y="186">POST /agents/.../runs</text><text x="485" y="225">execute_sql(sql)</text><text x="485" y="264">Block; agent uses gated tool</text><text x="565" y="303">run_admin_sql(sql)</text><text x="565" y="342">PAUSED before execution</text><text x="645" y="381">PAUSED requirement</text><text x="965" y="420">Create issue with tool/run details</text><text x="965" y="459">Store run-to-issue mapping</text><text x="565" y="498">Return PAUSED + run ID</text><text x="565" y="537">Reviewer changes Jira status</text><text x="325" y="576">GET approval status</text><text x="725" y="615">Fetch and map Jira status</text></g>
<text x="32" y="665" class="note">The hook blocks only DROP TABLE / ALTER TABLE sent through execute_sql. The gated tool runs direct SQL after confirmation.</text>
<rect x="32" y="686" width="610" height="286" rx="12" fill="#f0fdf4" stroke="#86efac"/><rect x="662" y="686" width="626" height="286" rx="12" fill="#fef2f2" stroke="#fca5a5"/><text x="56" y="718" font-size="16" font-weight="700" fill="#166534">APPROVED</text><text x="686" y="718" font-size="16" font-weight="700" fill="#991b1b">REJECTED / BLOCKED</text>
<g class="green"><path d="M110 762H553M553 806H110M110 850H553M553 894H110M110 938H553"/></g><g class="msg" text-anchor="middle"><text x="331" y="756">UI → POST /continue (after status check)</text><text x="331" y="800">API resumes Agno with confirmed=true</text><text x="331" y="844">run_admin_sql executes SQL in PostgreSQL</text><text x="331" y="888">PostgreSQL returns execution result</text><text x="331" y="932">Agent response returns to the UI</text></g>
<g class="red"><path d="M742 762H1190M1190 806H742M742 850H1190M1190 894H742"/></g><g class="msg" text-anchor="middle"><text x="966" y="756">UI → POST /reject when status is blocked</text><text x="966" y="800">API cancels the paused AgentOS run</text><text x="966" y="844">No confirmed tool call; protected SQL does not run</text><text x="966" y="888">UI receives a rejected result</text></g><text x="32" y="995" class="note">A reviewer changes Jira status; the application does not make the approval decision.</text></svg>
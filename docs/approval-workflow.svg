<svg xmlns="http://www.w3.org/2000/svg" width="360" height="378" viewBox="0 0 360 378" role="img" aria-labelledby="title desc">
  <title id="title">MCP approval workflow</title>
  <desc id="desc">A protected SQL request passes through an agent approval gate and Jira human review, then is either executed or cancelled.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#737373"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#25313d}
      .head{font-size:12px;font-weight:600}.sub{font-size:9.5px;fill:#52606d}
      .box{stroke:#737373;stroke-opacity:.4;stroke-width:1}
      .arrow{fill:none;stroke:#737373;stroke-width:1.4;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="360" height="378" fill="#fff"/>
  <rect class="box" x="38" y="10" width="284" height="48" rx="6" fill="#f3f4f6"/>
  <text class="head" x="180" y="29" text-anchor="middle">AI Agent + Postgres MCP</text>
  <text class="sub" x="180" y="45" text-anchor="middle">Requests a protected SQL tool call</text>
  <path class="arrow" d="M180 58V72"/>

  <rect class="box" x="38" y="76" width="284" height="48" rx="6" fill="#e8f1f6" stroke="#245b79"/>
  <text class="head" x="180" y="95" text-anchor="middle">Approval gate</text>
  <text class="sub" x="180" y="111" text-anchor="middle">Raw DROP / ALTER blocked; gated tool pauses</text>
  <path class="arrow" d="M180 124V138"/>

  <rect class="box" x="38" y="142" width="284" height="48" rx="6" fill="#f3f4f6"/>
  <text class="head" x="180" y="161" text-anchor="middle">Jira approval request</text>
  <text class="sub" x="180" y="177" text-anchor="middle">Middleware records the paused run for review</text>
  <path class="arrow" d="M180 190V204"/>

  <rect class="box" x="38" y="208" width="284" height="48" rx="6" fill="#f3f4f6"/>
  <text class="head" x="180" y="227" text-anchor="middle">Human reviewer</text>
  <text class="sub" x="180" y="243" text-anchor="middle">Approves or rejects the Jira request</text>

  <path d="M180 256V273H105V293M180 273H255V293" fill="none" stroke="#737373" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect x="30" y="298" width="150" height="66" rx="6" fill="#eaf6ed" stroke="#4d9560" stroke-opacity=".65"/>
  <text x="105" y="320" text-anchor="middle" class="head" fill="#246b39">Approved</text>
  <text x="105" y="338" text-anchor="middle" class="sub">Resume run and execute SQL</text>
  <text x="105" y="352" text-anchor="middle" class="sub">in PostgreSQL</text>

  <rect x="180" y="298" width="150" height="66" rx="6" fill="#fbefef" stroke="#b65a5a" stroke-opacity=".65"/>
  <text x="255" y="320" text-anchor="middle" class="head" fill="#8d3030">Rejected</text>
  <text x="255" y="338" text-anchor="middle" class="sub">Cancel paused run;</text>
  <text x="255" y="352" text-anchor="middle" class="sub">SQL is not executed</text>
</svg>